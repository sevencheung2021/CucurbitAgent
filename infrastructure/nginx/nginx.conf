worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Burst protection (app also enforces 20 LLM questions/day/IP).
  limit_req_zone $binary_remote_addr zone=llm_per_ip:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

  upstream web_upstream { server web:3000; }
  upstream api_upstream { server api:8000; }

  server {
    listen 80;
    client_max_body_size 50m;

    # LLM chat: stricter nginx throttle + forward real client IP
    location ~ ^/api/(agent/|literature/paper-chat|expression/.+chat|genes/.+chat|proteins/.+chat) {
      limit_req zone=llm_per_ip burst=5 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    location /api/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    location ~ ^/api/(genomes/download|proteins/pdb) {
      limit_req zone=api_general burst=10 nodelay;
      # Soft bandwidth cap for large genome dumps (bytes/sec)
      limit_rate 2m;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_http_version 1.1;
    }

    location /healthz { proxy_pass http://api_upstream/healthz; }
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
